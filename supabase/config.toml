project_id = "openwa-hal-demo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match your hosted project (Dashboard → Settings → Infrastructure). New
# projects run 17; `supabase link` warns if this differs.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false          # accounts are created by an admin, never self-serve

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "10MiB"

[functions.create-member]
verify_jwt = true

[functions.import-shipments]
verify_jwt = true
