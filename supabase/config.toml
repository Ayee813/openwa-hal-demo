project_id = "openwa-hal-demo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match your hosted project (Dashboard → Settings → Infrastructure). New
# projects run 17; `supabase link` warns if this differs.
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

# Staff sign in with HAL, not Supabase Auth: keep sign-up closed.
[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false

[auth.email]
enable_signup = false

[storage]
enabled = true
file_size_limit = "10MiB"

